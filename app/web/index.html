  <!--
    Pre-Flutter launch screen: the engine download takes long enough on
    web that the default white page reads as a broken load. This
    replicates the Flutter-side splash (lib/core/splash/splash_gate.dart —
    the application-state contract's settled 12b composition,
    docs/design/app-states.md) so startup shows the cream ground and the
    brand lockup from the first byte, and the flutter-first-frame handoff
    below is seamless.

    The lockup SVG is the binding 12b geometry (verbatim from
    docs/design/screens/app-states.html; also the canonical
    assets/splash/source/splash-mark.svg). The wordmark SVG is an outlined
    copy of the shaped "tekir" run (Fraunces 600, tracking −0.045em) —
    outlined rather than text because Fraunces isn't loaded yet; its
    displayed height (34.77px, the tight box at font-size 46) comes from
    `uv run assets/scripts/generate.py`'s printed metrics and matches the
    Flutter Text layout. The tagline falls back to system-ui until Work
    Sans loads, exactly like the app-states reference page does.
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #FDF8F0; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(120% 80% at 50% 34%, #FDF8F0 0%, #F2E2CD 100%);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding-bottom: 70px;
      transition: opacity .2s ease-out;
    }
    #splash .word { margin-top: 26px; }
    #splash .tag {
      margin-top: 12px;
      font: 700 13px 'Work Sans', system-ui, sans-serif;
      letter-spacing: .04em; color: #8A7563; text-align: center;
    }
  </style>

  <!--
    Maps JavaScript API, required by google_maps_flutter_web. The
    __GOOGLE_MAPS_API_KEY__ token below is substituted at run/build time —
    see scripts/run_web.sh — never a real key committed here directly.

    The key itself is still public by design once substituted (it ships
    in the compiled web bundle) — google_maps_flutter_web has no
    mechanism to keep it server-side. Its security comes from restricting
    it in the Cloud Console, not secrecy: HTTP referrer restriction (to
    localhost:5050 for the dev key, to the real domain for the prod key),
    API restriction to just "Maps JavaScript API", and a billing budget
    alert so an abused key fails loud instead of racking up cost quietly.
    Use separate dev/prod keys — none of this console setup can be done
    from this repo, it needs whoever owns the Google Cloud project.

    Not async/deferred, and placed in <head>: both this and the
    markerclusterer script below must finish before flutter_bootstrap.js
    (in <body>) starts the engine and calls into `google.maps`/
    `markerClusterer` — matches google_maps_flutter_web's own setup docs.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__"></script>

  <!-- marker clustering (features/map/ui/map_screen.dart's ClusterManager) -->
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.umd.min.js"></script>
</head>
