<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="cats of istanbul mobile app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Maps JavaScript API, required by google_maps_flutter_web. Replace
    YOUR_GOOGLE_MAPS_API_KEY with a real key from a Google Cloud project
    (Maps JavaScript API enabled): https://console.cloud.google.com/google/maps-apis

    This key is public by design (it ships in the compiled web bundle) —
    google_maps_flutter_web has no mechanism to keep it server-side. Its
    security comes from restricting it in the Cloud Console, not secrecy:
    HTTP referrer restriction to this app's domain(s), API restriction to
    just "Maps JavaScript API", and a billing budget alert so an abused key
    fails loud instead of racking up cost silently. None of that can be
    done from this repo — it needs whoever owns the Google Cloud project.

    Not async/deferred, and placed in <head>: both this and the
    markerclusterer script below must finish before flutter_bootstrap.js
    (in <body>) starts the engine and calls into `google.maps`/
    `markerClusterer` — matches google_maps_flutter_web's own setup docs.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCy2BuIm7pQFnQ4OoHuqqSiFm0zXd2f8ek"></script>

  <!-- marker clustering (features/map/ui/map_screen.dart's ClusterManager) -->
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.umd.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
