name: app
description: "tekir mobile app — cats of istanbul"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.17.1
  pointer_interceptor: ^0.10.1+2
  image_picker: ^1.2.3
  url_launcher: ^6.3.0
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  # Fraunces (display, cat names/screen titles) and Work Sans (body/ui) —
  # bundled as local variable-font assets (see assets/fonts/OFL-*.txt for
  # licenses) per docs/design/implementation-contract.md: no runtime font
  # CDN, no google_fonts dependency.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 700
