version: v1
name: tekir-change

repo:
  url: https://github.com/tekiristanbul/tekir.git
  defaultRevision: main
  publish:
    branchPrefix: asistan
    identity:
      name: asistan
      email: 315691971+asistanio@users.noreply.github.com

steps:
  - name: analyze
    agent: developer

  # routine-analysis releases this gate without a human when analyze
  # reported status: ready, adr.required: no and risk: low (and ends the
  # run outright when it reported work_required: no). Any other report
  # leaves it pending. approve-change deliberately has no auto predicate:
  # every run that changes code must still be seen by a human before it
  # publishes.
  - name: approve-plan
    type: approval
    auto: routine-analysis
    needs:
      - analyze

  - name: implement
    agent: developer
    needs:
      - approve-plan

  # Runs the repository's own tests before a human is asked to approve
  # anything: no agent, no model, a non-zero exit fails the run.
  - name: verify
    type: command
    run: |
      cd backend && go test ./...
      cd ../app && flutter pub get && dart format --set-exit-if-changed . && flutter test
    needs:
      - implement

  - name: review
    agent: reviewer
    needs:
      - verify

  - name: approve-change
    type: approval
    needs:
      - review

  - name: complete
    type: builtin
    action: complete
    needs:
      - approve-change
