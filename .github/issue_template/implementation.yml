name: maintainer implementation task
description: maintainer-authored ready implementation work; not a public request form
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        maintainers use this form only after product and technical decisions are sufficiently clear. it is not a feature-request, ux-proposal, architecture-proposal, or support form.

        external contributors should not create implementation issues. they may report bugs or claim an existing issue explicitly labeled `help wanted` after maintainer acknowledgement. ideas and questions belong in github discussions.
  - type: textarea
    id: problem
    attributes:
      label: problem
      description: what concrete problem must this implementation solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: user-visible behavior
      description: describe the expected behavior and turkish copy, or write "none".
    validations:
      required: true
  - type: textarea
    id: product-decisions
    attributes:
      label: product decisions
      description: list accepted product and ux decisions. identify any decision still pending.
    validations:
      required: true
  - type: textarea
    id: technical-constraints
    attributes:
      label: technical constraints
      description: list required architecture, api, schema, security, privacy, compatibility, or dependency boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: acceptance criteria
      description: use a short, testable checklist.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: design-reference
    attributes:
      label: design reference
      description: link repository design docs, prototype path, screenshots, or write "none".
    validations:
      required: true
  - type: textarea
    id: test-expectations
    attributes:
      label: test and evidence expectations
      description: name required unit, integration, widget, migration, manual checks, screenshots, or demo states.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: expected risk
      description: choose the highest expected risk for this change.
      options:
        - "low — isolated and easily reversible"
        - "medium — contract, behavior, or cross-layer change"
        - "high — migration, auth, permission, location, media, destructive action, breaking api, notification, or user data"
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: compatibility, recovery, and privacy notes
      description: describe existing-data safety, client compatibility, rollback/recovery, privacy, or abuse implications; write "not applicable" when none.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: out of scope
      description: state what this issue must not change.
    validations:
      required: true
  - type: dropdown
    id: product-owner-approval
    attributes:
      label: product owner approval required
      options:
        - "yes — keep the pull request draft and approval pending"
        - "no — no user behavior, copy, or visual output changes"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: dependencies and unresolved decisions
      description: link blocking issues or pull requests and list any unresolved decision; write "none" only when ready for assignment.
    validations:
      required: true
