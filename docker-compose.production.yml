# compose does not auto-load .env.production — always pass it explicitly:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
services:
  api:
    image: tekir-api:0.1.0
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-25060}/${POSTGRES_DB}?sslmode=require
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OTP_PROVIDER: twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      OBJECT_STORAGE_PROVIDER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}

  notifier:
    image: tekir-notifier:0.1.0
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-25060}/${POSTGRES_DB}?sslmode=require
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      NOTIFICATION_PROVIDER: fcm
      FCM_CREDENTIALS_FILE: /secrets/firebase-service-account.json
    volumes:
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro

  web:
    image: tekir-web:0.1.0
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
